appId: com.saurabhrajshekhar.kaira
productName: KAIRA
copyright: Copyright © 2026 Saurabh Raj Shekhar

directories:
  output: release
  buildResources: build

# The backend runs as a separate Node process that serves static files and
# reads modules from disk, so we keep the app unpacked (no asar) to guarantee
# those paths resolve identically to development.
asar: false

files:
  - electron/**/*
  - dist/**/*
  - assets/**/*
  - package.json

# The PyInstaller-frozen desktop agent (embeds its own Python runtime) is copied
# verbatim into resources/agent, so the target machine needs no Python.
extraResources:
  - from: agent_dist/myraa-agent
    to: agent
    filter: ["**/*"]

win:
  icon: assets/icons/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

# Phase 6: auto-update checks GitHub Releases on this repo. Publishing a new
# release (with the built artifacts attached) is what makes an update
# available — electron-updater does not build/publish anything itself.
publish:
  provider: github
  owner: Zephyrex21
  repo: kaira-ai-agent

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: KAIRA
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}.${ext}
